[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhole-diffusion"
version = "0.1.1"
description = "Pure Python full-rank chordless cycle basis — zero dependencies"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "@m15154178071-cmyk"}]
keywords = [
    "graph", "cycle", "cycle-basis", "chordless-cycle",
    "minimum-cycle-basis", "graph-theory", "topology",
    "zero-dependencies", "pure-python"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/m15154178071-cmyk/blackhole-diffusion"
Repository = "https://github.com/m15154178071-cmyk/blackhole-diffusion"
Issues = "https://github.com/m15154178071-cmyk/blackhole-diffusion/issues"

[tool.setuptools]
py-modules = ["blackhole_diffusion"]
